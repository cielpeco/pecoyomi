<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#f7f4ef" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="pecoyomi" />
  <title>pecoyomi</title>
  <!-- pecoyomi v0.13 -->
  <style>
    :root{
      --bg:#f7f4ef;
      --panel:#ffffff;
      --ink:#242424;
      --sub:#756f69;
      --line:#ded8d1;
      --accent:#6e6258;
      --accent-soft:#ebe5df;
      --danger:#a24c4c;
      --radius:18px;
      --shadow:0 8px 28px rgba(0,0,0,.06);
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif}
    body{overflow:hidden}
    button,textarea,input{font:inherit}
    button{border:0;background:none;color:inherit}
    .app{
      height:100dvh;
      padding:
        max(18px, calc(env(safe-area-inset-top) + 6px))
        14px
        max(12px, env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
      gap:10px;
      max-width:520px;
      margin:0 auto;
    }
    .swipe-region{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      touch-action:pan-y;
      will-change:transform;
      position:relative;
      z-index:1;
      background:transparent;
    }
    .swipe-region.is-dragging{
      transition:none!important;
    }
    
    .theme{
      background:var(--panel);
      border-radius:var(--radius);
      padding:12px 14px;
      box-shadow:var(--shadow);
      min-height:62px;
      display:flex;align-items:center;justify-content:center;gap:10px;
    }
    .theme-main{min-width:0;width:100%;text-align:center}
    .eyebrow{font-size:11px;color:var(--sub);margin-bottom:3px}
    .theme-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .daily{
      background:transparent;
      border-radius:0;
      padding:8px 4px 10px;
      box-shadow:none;
      min-height:150px;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      overflow:hidden;
      position:relative;
      isolation:isolate;
    }
    
    .daily-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }
    #dailyContent{
      max-height:100%;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      padding:10px 2px;
      -webkit-mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
      mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
    }
    #dailyContent::-webkit-scrollbar{display:none}
    .daily-card{text-align:center;font-size:25px;font-weight:700;margin:8px 0 10px;letter-spacing:.08em}
    .daily-text{
      text-align:center;
      font-size:16px;
      line-height:1.7;
      padding:0 2px;
    }
    .daily-text strong{font-weight:800}
    .moon-reading{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid var(--line);
      text-align:center;
    }
    .moon-label{
      font-size:11px;
      color:var(--sub);
      letter-spacing:.08em;
      margin-bottom:4px;
      font-weight:700;
    }
    .moon-text{
      font-size:13px;
      line-height:1.65;
      color:var(--ink);
    }
    .empty{
      color:var(--sub);
      text-align:center;
      line-height:1.7;
      font-size:14px;
    }

    .calendar{
      background:transparent;
      border-radius:0;
      padding:8px 2px 4px;
      box-shadow:none;
      flex:0 0 auto;
      position:relative;
      overflow:visible;
      z-index:0;
      isolation:isolate;
    }
    .month-number-bg{
      position:absolute;
      left:calc(100% / 7);
      bottom:100%;
      transform:translate(-50%, 18px);
      transform-origin:center bottom;
      font-size:148px;
      line-height:.78;
      font-weight:800;
      letter-spacing:-.08em;
      color:rgba(255,255,255,.20);
      text-shadow:none;
      pointer-events:none;
      user-select:none;
      z-index:0;
      white-space:nowrap;
      text-align:center;
    }
    .calendar-header,
    .weekdays,
    .days{
      position:relative;
      z-index:2;
    }
    .calendar-header{
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      margin:0 0 4px;
      min-height:34px;
    }
    .calendar-month{
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      color:var(--sub);
      text-transform:uppercase;
      text-align:left;
    }
    .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .weekdays div{
      text-align:center;font-size:12px;color:var(--sub);padding:2px 0 5px;letter-spacing:.06em;font-weight:600;
    }
    .day{
      position:relative;
      min-height:46px;
      border-radius:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      padding:4px 1px 3px;
      min-width:0;
    }
    .day-number{font-size:14px;line-height:1.1}
    .day-symbol{
      display:block;
      width:100%;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
      font-size:10px;
      font-weight:500;
      line-height:1.15;
      letter-spacing:-.025em;
    }
    @media (max-height:740px){
      .app{gap:7px}
      .swipe-region{gap:7px}
      .day{min-height:42px;gap:2px}
      .daily{min-height:105px;padding:6px 4px 8px}
      .month-number-bg{font-size:124px;left:calc(100% / 7);bottom:100%;transform:translate(-50%, 16px)}
      .daily-card{margin-top:14px}
    }
    .day.blank{visibility:hidden}
    .day.registered{font-weight:600}
    .day.today:not(.selected){
      background:var(--panel);
      box-shadow:0 1px 5px rgba(0,0,0,.05);
      border-radius:4px;
      font-weight:800;
    }
    .day.selected{
      background:var(--accent);
      color:white;
      font-weight:800;
      border-radius:4px;
    }
    .moon{
      position:absolute;right:3px;top:2px;font-size:8px;line-height:1
    }
    .selected .moon{filter:grayscale(1) brightness(3)}
    .sun{color:#b04b4b}
    .holiday{color:#b04b4b}
    .sat{color:#4c69a2}
    .day.selected.sun,
    .day.selected.holiday,
    .day.selected.sat{color:white}

    .controls{
      flex:0 0 auto;
      display:grid;
      grid-template-columns:1fr 1.15fr 1fr;
      gap:7px;
    }
    .controlbtn,.subbtn{
      min-height:42px;
      border-radius:13px;
      background:var(--panel);
      box-shadow:var(--shadow);
      font-weight:700;
    }
    .controlbtn.primary{background:var(--accent);color:#fff}
    .ghost-nav{
      opacity:0;
      box-shadow:none;
      background:transparent;
    }
    .subcontrols{
      display:grid;
      grid-template-columns:1fr;
      gap:7px;
      flex:0 0 auto;
    }
    .subbtn{min-height:42px;font-size:13px;color:var(--sub)}

    dialog{
      width:min(94vw,520px);
      max-height:min(84dvh,760px);
      border:0;border-radius:22px;padding:0;
      background:var(--panel);color:var(--ink);
      box-shadow:0 18px 60px rgba(0,0,0,.2);
    }
    dialog::backdrop{background:rgba(0,0,0,.32)}
    .modal{
      display:flex;flex-direction:column;max-height:min(84dvh,760px)
    }
    .modal-head{
      position:sticky;top:0;background:var(--panel);
      display:flex;justify-content:space-between;align-items:center;
      padding:14px 16px;border-bottom:1px solid var(--line);z-index:2;
    }
    .modal-head h2{font-size:17px;margin:0}
    .close{font-size:24px;color:var(--sub);padding:2px 6px}
    .modal-body{
      padding:16px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
    }
    .section{margin-bottom:22px}
    .section h3{font-size:14px;margin:0 0 8px;color:var(--sub)}
    .section .lead{font-size:18px;font-weight:700;margin-bottom:8px}
    .prose{font-size:15px;line-height:1.8;white-space:normal}
    .prose strong{font-weight:800}

    textarea{
      width:100%;min-height:42dvh;resize:vertical;
      border:1px solid var(--line);border-radius:14px;
      padding:12px;background:#fff;color:var(--ink);line-height:1.55;
    }
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .action{
      flex:1 1 140px;min-height:44px;border-radius:12px;
      background:var(--accent);color:#fff;font-weight:800;
    }
    .action.secondary{background:var(--accent-soft);color:var(--ink)}
    .action.danger{background:#f2dfdf;color:var(--danger)}
    .report{
      margin-top:12px;padding:11px 12px;border-radius:12px;
      background:var(--accent-soft);font-size:13px;line-height:1.6;
    }
    .report.bad{background:#f4e1e1;color:#7c3434}
    .hint{font-size:12px;color:var(--sub);line-height:1.6;margin-top:8px}
    .hidden{display:none!important}
  </style>
</head>
<body>
  <main class="app">
    <section class="swipe-region" id="monthSwipeRegion" aria-label="月切り替え領域">
      <button class="theme" id="themeButton" type="button">
        <div class="theme-main">
          <div class="eyebrow">今月のテーマ</div>
          <div class="theme-title" id="themeTitle">マンスリー未登録</div>
        </div>
      </button>

      <section class="daily" aria-live="polite">
        <div class="daily-inner">
          <div id="dailyEmpty" class="empty">
            この月のマンスリーはまだ登録されていません。<br>
            下の「月を追加 / 編集」から原文を貼り付けてね。
          </div>
          <div id="dailyContent" class="hidden">
            <div class="daily-card" id="dailyCard"></div>
            <div class="daily-text" id="dailyText"></div>
            <div id="moonReading"></div>
          </div>
        </div>
      </section>
    </section>

    <section class="calendar">
      <div class="month-number-bg" id="monthNumberBg">11</div>
      <div class="calendar-header">
        <div class="calendar-month" id="monthTitle">NOVEMBER 2026</div>
      </div>
      <div class="weekdays">
        <div class="sun">SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div class="sat">SAT</div>
      </div>
      <div class="days" id="calendarDays"></div>
    </section>

    <nav class="controls" aria-label="日付操作">
      <button class="controlbtn ghost-nav" id="prevDay" aria-label="前日"></button>
      <button class="controlbtn primary" id="todayBtn">今日</button>
      <button class="controlbtn ghost-nav" id="nextDay" aria-label="翌日"></button>
    </nav>

    <div class="subcontrols">
      <button class="subbtn" id="editMonth">月を追加 / 編集</button>
      <button class="hidden" id="backupBtn" aria-hidden="true" tabindex="-1">バックアップ</button>
    </div>
  </main>

  <dialog id="readingDialog">
    <div class="modal">
      <div class="modal-head">
        <h2 id="readingTitle">今月のリーディング</h2>
        <button class="close" data-close="readingDialog" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body" id="readingBody"></div>
    </div>
  </dialog>

  <dialog id="editDialog">
    <div class="modal">
      <div class="modal-head">
        <h2>マンスリーを追加 / 編集</h2>
        <button class="close" data-close="editDialog" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <textarea id="rawInput" placeholder="ここにマンスリー原文をそのまま貼り付け"></textarea>
        <div class="hint">
          基本書式：<br>
          【対象月】2026/11<br>
          【月テーマ】ルノルマン｜鳥 / ハワイアンロア｜波に乗る<br>
          【日ごと】1日｜十字架 … の形式
        </div>
        <div class="actions">
          <button class="action secondary" id="parseBtn">カレンダー化</button>
          <button class="action hidden" id="saveBtn">この内容で保存</button>
        </div>
        <div id="parseReport" class="report hidden"></div>
        <div class="actions" id="deleteArea"></div>
      </div>
    </div>
  </dialog>

  <dialog id="backupDialog">
    <div class="modal">
      <div class="modal-head">
        <h2>バックアップ</h2>
        <button class="close" data-close="backupDialog" aria-label="閉じる">×</button>
      </div>
      <div class="modal-body">
        <p class="prose">登録済みのマンスリーを1つのJSONファイルに書き出せるよ。復元するときは、そのJSONファイルを選択。</p>
        <div class="actions">
          <button class="action" id="exportBtn">書き出す</button>
          <label class="action secondary" style="display:grid;place-items:center;cursor:pointer">
            復元する
            <input id="importInput" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </div>
    </div>
  </dialog>

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'pecoyomi.months.v1';
  const $ = (id) => document.getElementById(id);

  const state = {
    months: loadMonths(),
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth() + 1,
    selectedDay: new Date().getDate(),
    pending: null
  };

  function loadMonths(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveMonths(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.months));
  }
  function keyOf(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
  function currentMonthData(){ return state.months[keyOf(state.viewYear,state.viewMonth)] || null; }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function weekdayJa(y,m,d){ return ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()]; }

  // 日本の祝日を計算（現行制度ベース）
  function nthWeekdayOfMonth(year, month, weekday, nth){
    const first = new Date(year, month - 1, 1).getDay();
    return 1 + ((7 + weekday - first) % 7) + (nth - 1) * 7;
  }
  function vernalEquinoxDay(year){
    return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  }
  function autumnEquinoxDay(year){
    return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  }
  function baseJapaneseHolidays(year){
    const h = new Map();
    const add=(m,d,name)=>h.set(`${m}-${d}`,name);

    add(1,1,'元日');
    add(1,nthWeekdayOfMonth(year,1,1,2),'成人の日');
    add(2,11,'建国記念の日');
    add(2,23,'天皇誕生日');
    add(3,vernalEquinoxDay(year),'春分の日');
    add(4,29,'昭和の日');
    add(5,3,'憲法記念日');
    add(5,4,'みどりの日');
    add(5,5,'こどもの日');
    add(7,nthWeekdayOfMonth(year,7,1,3),'海の日');
    add(8,11,'山の日');
    add(9,nthWeekdayOfMonth(year,9,1,3),'敬老の日');
    add(9,autumnEquinoxDay(year),'秋分の日');
    add(10,nthWeekdayOfMonth(year,10,1,2),'スポーツの日');
    add(11,3,'文化の日');
    add(11,23,'勤労感謝の日');

    return h;
  }
  function japaneseHolidayMap(year){
    const base = baseJapaneseHolidays(year);
    const result = new Map(base);

    // 国民の休日：祝日に挟まれた平日
    for(let m=1;m<=12;m++){
      const max = new Date(year,m,0).getDate();
      for(let d=2;d<max;d++){
        const key=`${m}-${d}`;
        if(result.has(key)) continue;
        const prevDate=new Date(year,m-1,d-1);
        const nextDate=new Date(year,m-1,d+1);
        const prevKey=`${prevDate.getMonth()+1}-${prevDate.getDate()}`;
        const nextKey=`${nextDate.getMonth()+1}-${nextDate.getDate()}`;
        if(base.has(prevKey) && base.has(nextKey)){
          result.set(key,'国民の休日');
        }
      }
    }

    // 振替休日：日曜の祝日の次の「祝日でない日」
    const ordered=[...base.entries()].map(([key,name])=>{
      const [m,d]=key.split('-').map(Number);
      return {m,d,name,date:new Date(year,m-1,d)};
    }).sort((a,b)=>a.date-b.date);

    for(const item of ordered){
      if(item.date.getDay()!==0) continue;
      let dt=new Date(year,item.m-1,item.d+1);
      while(dt.getFullYear()===year){
        const k=`${dt.getMonth()+1}-${dt.getDate()}`;
        if(!result.has(k)){
          result.set(k,'振替休日');
          break;
        }
        dt.setDate(dt.getDate()+1);
      }
    }
    return result;
  }

  function escapeHtml(s=''){
    return String(s).replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    })[ch]);
  }
  function renderText(s=''){
    let safe = escapeHtml(s);
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return safe.replace(/\n/g,'<br>');
  }

  function extractSections(raw){
    const out = {};
    const re = /【([^】]+)】/g;
    const matches = [...raw.matchAll(re)];
    matches.forEach((m,i)=>{
      const name = m[1].trim();
      const start = m.index + m[0].length;
      const end = i + 1 < matches.length ? matches[i+1].index : raw.length;
      out[name] = raw.slice(start,end).trim();
    });
    return out;
  }

  function parseTheme(text=''){
    const lines = text.split(/\r?\n/);
    let lenormand = '', loa = '';
    const body = [];
    for (const line of lines){
      const t = line.trim();
      let m;
      if ((m = t.match(/^ルノルマン\s*[｜|]\s*(.+)$/))) lenormand = m[1].trim();
      else if ((m = t.match(/^ハワイアンロア\s*[｜|]\s*(.+)$/))) loa = m[1].trim();
      else body.push(line);
    }
    if (!lenormand && !loa){
      const firstNonEmpty = body.findIndex(x => x.trim());
      if (firstNonEmpty >= 0){
        const first = body[firstNonEmpty].trim();
        const p = first.split(/\s*[+＋]\s*/);
        if (p.length >= 2){
          lenormand = p.shift().trim();
          loa = p.join('+').trim();
          body.splice(firstNonEmpty,1);
        }
      }
    }
    return { lenormand, loa, text: body.join('\n').trim() };
  }

  function parseMoon(text=''){
    const lines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    if (!lines.length) return null;
    const dm = lines[0].match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
    const card = lines[1] || '';
    return dm ? {
      month:Number(dm[1]), day:Number(dm[2]), card,
      text:lines.slice(2).join('\n').trim()
    } : null;
  }

  function parseDays(text=''){
    const lines = text.split(/\r?\n/);
    const days = {};
    let current = null;
    let body = [];
    const flush = () => {
      if (current){
        days[current.day] = { card: current.card, text: body.join('\n').trim() };
      }
      body = [];
    };
    for (const line of lines){
      const m = line.match(/^\s*(\d{1,2})日\s*[｜|]\s*(.+?)\s*$/);
      if (m){
        flush();
        current = { day:Number(m[1]), card:m[2].trim() };
      } else if (current){
        body.push(line);
      }
    }
    flush();
    return days;
  }

  function parseRaw(raw){
    const sections = extractSections(raw);
    const target = (sections['対象月'] || '').match(/(\d{4})\s*[\/\-]\s*(\d{1,2})/);
    if (!target) throw new Error('【対象月】に 2026/11 のような年月が見つからないよ。');

    const year = Number(target[1]);
    const month = Number(target[2]);
    if (month < 1 || month > 12) throw new Error('対象月の「月」が1〜12になっていないよ。');

    const creation = (sections['作成日'] || '').match(/(\d{4})\s*[\/\-]\s*(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);
    const theme = parseTheme(sections['月テーマ'] || '');
    const days = parseDays(sections['日ごと'] || '');
    const max = daysInMonth(year,month);
    const nums = Object.keys(days).map(Number);
    const invalid = nums.filter(d => d < 1 || d > max);
    invalid.forEach(d => delete days[d]);

    return {
      version:1,
      year, month,
      createdAt: creation ? `${creation[1]}-${String(creation[2]).padStart(2,'0')}-${String(creation[3]).padStart(2,'0')}` : '',
      theme,
      overview: sections['全体'] || '',
      newMoon: parseMoon(sections['新月'] || ''),
      fullMoon: parseMoon(sections['満月'] || ''),
      days,
      raw
    };
  }

  function validateMonth(data){
    const max = daysInMonth(data.year,data.month);
    const present = Object.keys(data.days).map(Number);
    const missing = [];
    for (let d=1; d<=max; d++) if (!present.includes(d)) missing.push(d);
    const warnings = [];
    if (!data.theme.lenormand) warnings.push('月テーマの「ルノルマン」が未取得');
    if (!data.theme.loa) warnings.push('月テーマの「ハワイアンロア」が未取得');
    if (!data.overview) warnings.push('【全体】が空');
    if (!data.newMoon) warnings.push('【新月】を取得できていない');
    if (!data.fullMoon) warnings.push('【満月】を取得できていない');
    if (missing.length) warnings.push(`日別が ${present.length}/${max} 件（未取得: ${missing.join(', ')}日）`);
    return { max, present: present.length, missing, warnings };
  }

  function monthNameEn(month){
    return ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][month-1];
  }

  function render(){
    $('monthTitle').textContent = `${monthNameEn(state.viewMonth)} ${state.viewYear}`;
    $('monthNumberBg').textContent = String(state.viewMonth);
    const data = currentMonthData();
    const max = daysInMonth(state.viewYear,state.viewMonth);
    if (state.selectedDay > max) state.selectedDay = max;

    if (data){
      const tt = [data.theme.lenormand, data.theme.loa].filter(Boolean).join(' × ');
      $('themeTitle').textContent = tt || 'テーマ未設定';
    } else {
      $('themeTitle').textContent = 'マンスリー未登録';
    }

    renderDaily(data);
    renderCalendar(data);
  }

  function renderDaily(data){
    const d = state.selectedDay;
    const dayData = data?.days?.[d];
    if (!dayData){
      $('dailyContent').classList.add('hidden');
      $('dailyEmpty').classList.remove('hidden');
      $('dailyEmpty').innerHTML = data
        ? `${d}日のリーディングは未登録です。`
        : `この月のマンスリーはまだ登録されていません。<br>下の「月を追加 / 編集」から原文を貼り付けてね。`;
      return;
    }
    $('dailyEmpty').classList.add('hidden');
    $('dailyContent').classList.remove('hidden');
    $('dailyCard').textContent = dayData.card;
    $('dailyText').innerHTML = renderText(dayData.text);

    const moonParts = [];
    if(data?.newMoon?.day===d && data.newMoon.month===state.viewMonth){
      moonParts.push(`
        <div class="moon-reading">
          <div class="moon-label">NEW MOON</div>
          <div class="moon-text">${renderText(data.newMoon.text)}</div>
        </div>`);
    }
    if(data?.fullMoon?.day===d && data.fullMoon.month===state.viewMonth){
      moonParts.push(`
        <div class="moon-reading">
          <div class="moon-label">FULL MOON</div>
          <div class="moon-text">${renderText(data.fullMoon.text)}</div>
        </div>`);
    }
    $('moonReading').innerHTML = moonParts.join('');
  }

  function renderCalendar(data){
    const root = $('calendarDays');
    root.innerHTML = '';
    const first = new Date(state.viewYear,state.viewMonth-1,1).getDay();
    const max = daysInMonth(state.viewYear,state.viewMonth);
    const now = new Date();
    const holidays = japaneseHolidayMap(state.viewYear);

    for (let i=0;i<first;i++){
      const b = document.createElement('div');
      b.className='day blank'; root.appendChild(b);
    }

    for (let d=1; d<=max; d++){
      const btn = document.createElement('button');
      btn.type='button';
      btn.className='day';
      const dow = new Date(state.viewYear,state.viewMonth-1,d).getDay();
      const holidayName = holidays.get(`${state.viewMonth}-${d}`);
      if (dow===0) btn.classList.add('sun');
      if (holidayName) btn.classList.add('holiday');
      if (dow===6) btn.classList.add('sat');
      if (data?.days?.[d]) btn.classList.add('registered');
      if (d===state.selectedDay) btn.classList.add('selected');
      if (state.viewYear===now.getFullYear() && state.viewMonth===now.getMonth()+1 && d===now.getDate()) btn.classList.add('today');

      let moon = '';
      if (data?.newMoon?.day===d && data.newMoon.month===state.viewMonth) moon += '<span class="moon">●</span>';
      if (data?.fullMoon?.day===d && data.fullMoon.month===state.viewMonth) moon += '<span class="moon">○</span>';
      const symbol = data?.days?.[d]?.card || '';
      btn.innerHTML = `<span class="day-number">${d}</span><span class="day-symbol">${escapeHtml(symbol)}</span>${moon}`;
      btn.setAttribute('aria-label', `${state.viewMonth}月${d}日${symbol ? '、'+symbol : ''}`);
      btn.addEventListener('click',()=>{state.selectedDay=d;render();});
      root.appendChild(btn);
    }
  }

  function changeMonth(delta){
    let y=state.viewYear, m=state.viewMonth+delta;
    if (m<1){m=12;y--}
    if (m>12){m=1;y++}
    state.viewYear=y; state.viewMonth=m; state.selectedDay=1;
    render();
  }

  function changeDay(delta){
    let dt = new Date(state.viewYear,state.viewMonth-1,state.selectedDay+delta);
    state.viewYear=dt.getFullYear();
    state.viewMonth=dt.getMonth()+1;
    state.selectedDay=dt.getDate();
    render();
  }

  function goToday(){
    const n=new Date();
    state.viewYear=n.getFullYear();state.viewMonth=n.getMonth()+1;state.selectedDay=n.getDate();
    render();
  }

  function openReading(){
    const data=currentMonthData();
    $('readingTitle').textContent=`${state.viewYear}年${state.viewMonth}月のリーディング`;
    if(!data){
      $('readingBody').innerHTML='<div class="empty">この月はまだ登録されていません。</div>';
    }else{
      const themeName=[data.theme.lenormand,data.theme.loa].filter(Boolean).join(' × ');
      $('readingBody').innerHTML=`
        <section class="section">
          <h3>月テーマ</h3>
          <div class="lead">${escapeHtml(themeName)}</div>
          <div class="prose">${renderText(data.theme.text)}</div>
        </section>
        <section class="section">
          <h3>全体</h3>
          <div class="prose">${renderText(data.overview)}</div>
        </section>
        ${data.newMoon ? `<section class="section"><h3>新月 ${data.newMoon.month}/${data.newMoon.day}</h3><div class="lead">${escapeHtml(data.newMoon.card)}</div><div class="prose">${renderText(data.newMoon.text)}</div></section>`:''}
        ${data.fullMoon ? `<section class="section"><h3>満月 ${data.fullMoon.month}/${data.fullMoon.day}</h3><div class="lead">${escapeHtml(data.fullMoon.card)}</div><div class="prose">${renderText(data.fullMoon.text)}</div></section>`:''}
      `;
    }
    $('readingDialog').showModal();
  }

  function openEditor(){
    const data=currentMonthData();
    $('rawInput').value=data?.raw || '';
    $('parseReport').classList.add('hidden');
    $('saveBtn').classList.add('hidden');
    state.pending=null;
    renderDelete(data);
    $('editDialog').showModal();
  }

  function renderDelete(data){
    const area=$('deleteArea');
    area.innerHTML='';
    if(!data) return;
    const btn=document.createElement('button');
    btn.className='action danger';
    btn.textContent='この月を削除';
    btn.addEventListener('click',()=>{
      if(confirm(`${data.year}年${data.month}月を削除する？`)){
        delete state.months[keyOf(data.year,data.month)];
        saveMonths(); $('editDialog').close(); render();
      }
    });
    area.appendChild(btn);
  }

  $('parseBtn').addEventListener('click',()=>{
    const box=$('parseReport');
    try{
      const data=parseRaw($('rawInput').value);
      const v=validateMonth(data);
      state.pending=data;
      box.className='report';
      box.innerHTML=`
        <strong>${data.year}年${data.month}月</strong> として読み取りました。<br>
        日別：${v.present}/${v.max}件<br>
        月テーマ：${escapeHtml([data.theme.lenormand,data.theme.loa].filter(Boolean).join(' × ') || '未取得')}<br>
        新月：${data.newMoon ? `${data.newMoon.month}/${data.newMoon.day} ${escapeHtml(data.newMoon.card)}` : '未取得'}<br>
        満月：${data.fullMoon ? `${data.fullMoon.month}/${data.fullMoon.day} ${escapeHtml(data.fullMoon.card)}` : '未取得'}
        ${v.warnings.length ? `<br><br>⚠️ ${v.warnings.map(escapeHtml).join('<br>⚠️ ')}` : '<br><br>✓ 大きな抜けは見つかりませんでした。'}
      `;
      box.classList.remove('hidden');
      $('saveBtn').classList.remove('hidden');
    }catch(e){
      state.pending=null;
      box.className='report bad';
      box.textContent=e.message;
      box.classList.remove('hidden');
      $('saveBtn').classList.add('hidden');
    }
  });

  $('saveBtn').addEventListener('click',()=>{
    if(!state.pending) return;
    const data=state.pending;
    state.months[keyOf(data.year,data.month)]=data;
    saveMonths();
    state.viewYear=data.year;state.viewMonth=data.month;
    const now=new Date();
    state.selectedDay = (now.getFullYear()===data.year && now.getMonth()+1===data.month) ? now.getDate() : 1;
    $('editDialog').close();
    render();
  });

  function exportBackup(){
    const payload={app:'pecoyomi',version:1,exportedAt:new Date().toISOString(),months:state.months};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`pecoyomi_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }

  $('importInput').addEventListener('change',async(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const obj=JSON.parse(await file.text());
      if(obj.app!=='pecoyomi' || !obj.months) throw new Error('pecoyomiのバックアップではないみたい。');
      if(!confirm('現在の登録データを、選んだバックアップで置き換える？')) return;
      state.months=obj.months;saveMonths();$('backupDialog').close();render();
      alert('復元しました。');
    }catch(err){ alert(err.message || '復元できませんでした。'); }
    e.target.value='';
  });

  const monthSwipeRegion = $('monthSwipeRegion');
  let swipeStartX = 0;
  let swipeStartY = 0;
  let swipeDx = 0;
  let swipeActive = false;
  let swipeHorizontal = false;
  let swipeAnimating = false;

  function setSwipeTransform(x, animate=false){
    monthSwipeRegion.style.transition = animate
      ? 'transform 180ms cubic-bezier(.22,.8,.28,1), opacity 180ms ease'
      : 'none';
    monthSwipeRegion.style.transform = `translate3d(${x}px,0,0)`;
  }

  function finishMonthSwipe(direction){
    if(swipeAnimating) return;
    swipeAnimating = true;

    // 指を離した瞬間に月を切り替え、着地だけを短く見せる。
    // 左フリック（direction > 0）では次月が右側から、
    // 右フリックでは前月が左側から少しだけ入ってくる。
    const width = Math.max(monthSwipeRegion.clientWidth, 320);
    changeMonth(direction);

    const enterX = direction > 0 ? width * 0.10 : -width * 0.10;
    monthSwipeRegion.style.transition = 'none';
    monthSwipeRegion.style.transform = `translate3d(${enterX}px,0,0)`;
    monthSwipeRegion.style.opacity = '.82';

    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>{
        monthSwipeRegion.style.transition = 'transform 110ms cubic-bezier(.2,.8,.3,1), opacity 90ms ease-out';
        monthSwipeRegion.style.transform = 'translate3d(0,0,0)';
        monthSwipeRegion.style.opacity = '1';

        window.setTimeout(()=>{
          swipeAnimating = false;
          monthSwipeRegion.style.transition = '';
          monthSwipeRegion.style.transform = '';
          monthSwipeRegion.style.opacity = '';
        }, 120);
      });
    });
  }

  monthSwipeRegion.addEventListener('pointerdown',(e)=>{
    if(swipeAnimating) return;
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
    swipeDx = 0;
    swipeActive = true;
    swipeHorizontal = false;
    monthSwipeRegion.classList.add('is-dragging');
  });

  monthSwipeRegion.addEventListener('pointermove',(e)=>{
    if(!swipeActive || swipeAnimating) return;
    const dx = e.clientX - swipeStartX;
    const dy = e.clientY - swipeStartY;

    if(!swipeHorizontal && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      if(Math.abs(dx) <= Math.abs(dy)){
        swipeActive = false;
        monthSwipeRegion.classList.remove('is-dragging');
        setSwipeTransform(0, true);
        return;
      }
      swipeHorizontal = true;
    }

    if(swipeHorizontal){
      swipeDx = dx;
      const resisted = dx * .72;
      setSwipeTransform(resisted, false);
    }
  });

  function endSwipe(){
    if(!swipeActive || swipeAnimating) return;
    swipeActive = false;
    monthSwipeRegion.classList.remove('is-dragging');

    if(swipeHorizontal && Math.abs(swipeDx) >= 56){
      // 左フリック = 翌月、右フリック = 前月
      finishMonthSwipe(swipeDx < 0 ? 1 : -1);
    }else{
      monthSwipeRegion.style.opacity = '1';
      monthSwipeRegion.style.transition = 'transform 110ms cubic-bezier(.2,.8,.3,1)';
      monthSwipeRegion.style.transform = 'translate3d(0,0,0)';
      window.setTimeout(()=>{
        monthSwipeRegion.style.transition = '';
        monthSwipeRegion.style.transform = '';
      }, 120);
    }
  }

  monthSwipeRegion.addEventListener('pointerup', endSwipe);
  monthSwipeRegion.addEventListener('pointercancel', endSwipe);
  monthSwipeRegion.addEventListener('lostpointercapture', endSwipe);

  $('prevDay').addEventListener('click',()=>changeDay(-1));
  $('nextDay').addEventListener('click',()=>changeDay(1));
  $('todayBtn').addEventListener('click',goToday);
  $('themeButton').addEventListener('click',openReading);
  $('editMonth').addEventListener('click',openEditor);
  $('backupBtn').addEventListener('click',()=>$('backupDialog').showModal());
  $('exportBtn').addEventListener('click',exportBackup);

  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click',()=>$(btn.dataset.close).close());
  });

  [$('readingDialog'),$('editDialog'),$('backupDialog')].forEach(dlg=>{
    dlg.addEventListener('click',(e)=>{
      const r=dlg.getBoundingClientRect();
      if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) dlg.close();
    });
  });

  render();
})();
</script>
</body>
</html>
