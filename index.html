<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#FFF8FB" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="pecoyomi" />
  <title>pecoyomi</title>
  <!-- pecoyomi v0.46 -->
  <style>
    :root{
      --bg:#FFFAFC;
      --panel:#ffffff;
      /* iOSのステータス表示と喧嘩しない、柔らかいシステム黒 */
      --ink:rgba(28,28,30,.92);
      /* 補助文字は同じ黒を透過。背景グラデーションを自然に拾う */
      --sub:rgba(28,28,30,.54);
      /* 水平線は背景色に引っぱられないニュートラルグレー */
      --separator:#B8B8BC;
      --line:#ded8d1;
      /* 選択・主要アクションの基準色 */
      --accent:#51516F;
      --accent-soft:#ECEAF3;
      --danger:#a24c4c;
      --radius:18px;
      --shadow:0 8px 28px rgba(0,0,0,.06);
      --app-background:
        radial-gradient(
          ellipse 90% 58% at 0% 8%,
          rgba(248,209,224,.67) 0%,
          rgba(248,222,233,.41) 39%,
          rgba(248,222,233,0) 80%
        ),
        radial-gradient(
          ellipse 98% 66% at 122% 20%,
          rgba(228,219,247,.74) 0%,
          rgba(239,232,250,.48) 42%,
          rgba(239,232,250,0) 82%
        ),
        radial-gradient(
          ellipse 136% 74% at 8% 114%,
          rgba(184,220,241,.68) 0%,
          rgba(212,236,247,.46) 45%,
          rgba(212,236,247,0) 84%
        ),
        radial-gradient(
          ellipse 112% 84% at 106% 108%,
          rgba(248,234,183,.50) 0%,
          rgba(252,243,212,.34) 40%,
          rgba(252,243,212,0) 78%
        ),
        radial-gradient(
          ellipse 70% 54% at 23% 66%,
          rgba(249,238,195,.26) 0%,
          rgba(252,244,216,.17) 42%,
          rgba(252,244,216,0) 82%
        ),
        linear-gradient(
          160deg,
          #FFF8FB 0%,
          #FBF8FF 48%,
          #FDFBF5 100%
        );
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{
      margin:0;
      width:100%;
      height:100%;
      min-height:100dvh;
      color:var(--ink);
      font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
      background:var(--app-background);
      background-repeat:no-repeat;
      background-size:100vw 100dvh;
      background-attachment:fixed;
    }
    body{
      overflow:hidden;
    }
    button,textarea,input{font:inherit}
    button{border:0;background:none;color:inherit}
    .app{
      /* 背景だけ全面化し、UIは従来のsafe-area内に戻す */
      height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      padding:18px 14px 12px;
      display:flex;
      flex-direction:column;
      gap:10px;
      max-width:520px;
      margin:
        env(safe-area-inset-top)
        auto
        env(safe-area-inset-bottom);
      position:relative;
      isolation:isolate;
    }
    .swipe-region{
      flex:1 1 auto;
      min-height:0;
      display:flex;
      flex-direction:column;
      gap:10px;
      touch-action:pan-y;
      will-change:transform;
      position:relative;
      z-index:1;
      background:transparent;
    }
    .swipe-region.is-dragging{
      transition:none!important;
    }
    
    .theme{
      background:rgba(255,255,255,.095);
      -webkit-backdrop-filter:blur(8px) saturate(112%);
      backdrop-filter:blur(8px) saturate(112%);
      border:0;
      border-radius:999px;
      padding:12px 14px;
      box-shadow:
        0 4px 16px rgba(70,60,50,.055),
        0 1px 2px rgba(70,60,50,.11),
        inset 0 1px 0 rgba(255,255,255,.72),
        inset 0 -1px 0 rgba(70,60,50,.055);
      min-height:62px;
      display:flex;align-items:center;justify-content:center;gap:10px;
      -webkit-tap-highlight-color:transparent;
      transition:
        transform 70ms ease-out,
        background 70ms ease-out,
        box-shadow 70ms ease-out;
    }
    .theme:active{
      background:rgba(255,255,255,.16);
      box-shadow:
        0 2px 9px rgba(70,60,50,.045),
        0 1px 2px rgba(70,60,50,.09),
        inset 0 1px 0 rgba(255,255,255,.60),
        inset 0 -1px 0 rgba(70,60,50,.045);
    }

    /* 月テーマ詳細を開いている間は、有効色を少しだけ静かに */
    body.reading-open .controlbtn.primary,
    body.edit-open .controlbtn.primary{
      background:rgba(81,81,111,.58);
      box-shadow:
        0 4px 12px rgba(55,55,82,.08),
        0 1px 2px rgba(48,48,72,.11),
        inset 0 1px 0 rgba(255,255,255,.18),
        inset 0 -1px 0 rgba(45,45,68,.07);
    }
    body.reading-open .day.selected,
    body.edit-open .day.selected{
      background:rgba(81,81,111,.50);
      color:rgba(255,255,255,.96);
    }
    body.reading-open #editMonth::before,
    body.edit-open #editMonth::before{
      background:rgba(81,81,111,.64);
    }
    .theme-main{min-width:0;width:100%;text-align:center}
    .eyebrow{font-size:11px;color:var(--sub);margin-bottom:3px}
    .theme-title{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .daily{
      background:transparent;
      border-radius:0;
      padding:8px 4px 10px;
      box-shadow:none;
      min-height:150px;
      flex:1 1 auto;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      overflow:hidden;
      position:relative;
      isolation:isolate;
    }
    
    .daily-inner{
      position:relative;
      z-index:1;
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      flex:1 1 auto;
      min-height:0;
      overflow:hidden;
    }
    #dailyContent{
      max-height:100%;
      overflow-y:auto;
      overscroll-behavior:contain;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
      padding:10px 2px;
      -webkit-mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
      mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
    }
    #dailyContent::-webkit-scrollbar{display:none}
    .daily-card{text-align:center;font-size:25px;font-weight:700;margin:8px 0 10px;letter-spacing:.08em}
    .daily-text{
      text-align:center;
      font-size:16px;
      line-height:1.7;
      padding:0 2px;
    }
    .daily-text strong{font-weight:800}
    .moon-reading{
      margin-top:14px;
      padding-top:12px;
      border-top:1px solid var(--separator);
      text-align:center;
    }
    .moon-label{
      font-size:11px;
      color:var(--sub);
      letter-spacing:.08em;
      margin-bottom:4px;
      font-weight:700;
    }
    .moon-text{
      font-size:13px;
      line-height:1.65;
      color:var(--ink);
    }
    .empty{
      color:var(--sub);
      text-align:center;
      line-height:1.7;
      font-size:14px;
    }

    .calendar{
      background:transparent;
      border-radius:0;
      padding:8px 2px 4px;
      box-shadow:none;
      flex:0 0 auto;
      position:relative;
      overflow:visible;
      z-index:0;
      isolation:isolate;
    }
    .month-number-bg{
      position:absolute;
      /*
        5行カレンダー時の位置を基準に完全固定。
        横中心 = SUN / MON の列中心の中間。
        下辺 = 曜日ラベルの少し上。
      */
      left:calc(14.2857% + 10px);
      bottom:384px;
      transform:translateX(-50%);
      transform-origin:center bottom;
      width:1.42em;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-size:222px;
      line-height:.78;
      font-weight:800;
      font-variant-numeric:tabular-nums;
      letter-spacing:-.065em;
      color:rgba(255,255,255,.30);
      text-shadow:none;
      pointer-events:none;
      user-select:none;
      z-index:0;
      white-space:nowrap;
      text-align:center;
      opacity:1;
      transition:opacity 55ms ease-out;
      will-change:opacity;
    }
        .swipe-region,
    .calendar,
    .controls,
    .subcontrols{
      position:relative;
      z-index:2;
    }
    .calendar-header,
    .weekdays,
    .days{
      position:relative;
      z-index:2;
    }
    .calendar-header{
      display:flex;
      align-items:flex-end;
      justify-content:flex-start;
      margin:0 0 4px;
      min-height:34px;
    }
    .calendar-month{
      font-size:12px;
      font-weight:700;
      letter-spacing:.08em;
      color:var(--sub);
      text-transform:uppercase;
      text-align:left;
    }
    .weekdays,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
    .weekdays div{
      text-align:center;font-size:12px;color:var(--sub);padding:2px 0 5px;letter-spacing:.06em;font-weight:600;
    }
    .day{
      position:relative;
      min-height:46px;
      border-radius:10px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      padding:4px 1px 3px;
      min-width:0;
    }
    .day-number{font-size:14px;line-height:1.1}
    .day-symbol{
      display:block;
      width:100%;
      text-align:center;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:clip;
      font-size:10px;
      font-weight:500;
      line-height:1.15;
      letter-spacing:-.025em;
    }
    @media (max-height:740px){
      .app{gap:7px}
      .swipe-region{gap:7px}
      .day{min-height:42px;gap:2px}
      .daily{min-height:105px;padding:6px 4px 8px}
      .month-number-bg{font-size:186px;left:calc(14.2857% + 10px);bottom:356px;transform:translateX(-50%);width:1.42em}
      .daily-card{margin-top:14px}
    }
    .day.blank{visibility:hidden}
    .day.registered{font-weight:600}
    .day.today:not(.selected){
      background:var(--panel);
      box-shadow:0 1px 5px rgba(0,0,0,.05);
      border-radius:4px;
      font-weight:800;
    }
    .day.selected{
      background:var(--accent);
      color:white;
      font-weight:800;
      border-radius:4px;
    }
    .moon{
      position:absolute;right:3px;top:2px;font-size:8px;line-height:1
    }
    .selected .moon{filter:grayscale(1) brightness(3)}
    .sun{color:#b04b4b}
    .holiday{color:#b04b4b}
    .sat{color:#4c69a2}
    .day.selected.sun,
    .day.selected.holiday,
    .day.selected.sat{color:white}

    .controls{
      flex:0 0 auto;
      display:grid;
      grid-template-columns:1fr 1.15fr 1fr;
      gap:7px;
    }
    .controlbtn,.subbtn{
      min-height:42px;
      border:0;
      border-radius:999px;
      background:rgba(255,255,255,.20);
      color:rgba(81,81,111,.94);
      -webkit-backdrop-filter:blur(10px) saturate(112%);
      backdrop-filter:blur(10px) saturate(112%);
      box-shadow:
        0 4px 14px rgba(70,60,50,.05),
        0 1px 2px rgba(70,60,50,.105),
        inset 0 1px 0 rgba(255,255,255,.70),
        inset 0 -1px 0 rgba(70,60,50,.05);
      font-weight:700;
      -webkit-tap-highlight-color:transparent;
      transition:
        transform 70ms ease-out,
        background 70ms ease-out,
        box-shadow 70ms ease-out,
        color 70ms ease-out;
    }
    .controlbtn.primary{
      background:rgba(81,81,111,.76);
      color:#fff;
      box-shadow:
        0 4px 14px rgba(55,55,82,.12),
        0 1px 2px rgba(48,48,72,.16),
        inset 0 1px 0 rgba(255,255,255,.36),
        inset 0 -1px 0 rgba(45,45,68,.11);
    }
    .controlbtn:not(.ghost-nav):active,
    .subbtn:active{
      background:rgba(255,255,255,.29);
      box-shadow:
        0 2px 8px rgba(70,60,50,.04),
        0 1px 2px rgba(70,60,50,.085),
        inset 0 1px 0 rgba(255,255,255,.58),
        inset 0 -1px 0 rgba(70,60,50,.04);
    }
    .controlbtn.primary:active{
      background:rgba(81,81,111,.86);
    }
    .ghost-nav{
      opacity:0;
      box-shadow:none;
      background:transparent;
      -webkit-backdrop-filter:none;
      backdrop-filter:none;
    }
    .subcontrols{
      display:grid;
      grid-template-columns:1fr;
      gap:7px;
      flex:0 0 auto;
    }
    .subbtn{min-height:42px;font-size:13px;color:rgba(81,81,111,.94)}

    /* 月を追加 / 編集：長押しで裏メニューへ。0.5秒後から中央塗りを0.7秒表示 */
    #editMonth{
      position:relative;
      overflow:hidden;
      isolation:isolate;
      -webkit-touch-callout:none;
      user-select:none;
      -webkit-user-select:none;
    }
    #editMonth::before{
      content:"";
      position:absolute;
      left:50%;
      top:50%;
      width:120%;
      aspect-ratio:1 / 1;
      border-radius:50%;
      background:rgba(81,81,111,.80);
      opacity:0;
      transform:translate(-50%,-50%) scale(0);
      transform-origin:center center;
      transition:
        transform 180ms ease-out,
        opacity 120ms ease-out;
      pointer-events:none;
      z-index:0;
    }
    #editMonth .edit-month-label{
      position:relative;
      z-index:1;
      transition:color 180ms ease-out;
    }
    #editMonth.is-secret-filling::before{
      opacity:1;
      transform:translate(-50%,-50%) scale(1);
      transition:
        transform 700ms linear,
        opacity 80ms ease-out;
    }
    #editMonth.is-secret-filling .edit-month-label{
      color:#fff;
      transition:color 700ms linear;
    }


    /* 月テーマ：特殊ボタン枠。今後、通常ボタンと別演出に調整できるよう独立 */
    .theme{
      transform-origin:center center;
      transition:
        transform 80ms cubic-bezier(.2,.8,.3,1),
        background 70ms ease-out,
        box-shadow 70ms ease-out;
      will-change:transform;
    }
    .theme.is-theme-pressed{
      transform:scale(.965);
    }

    /* 通常ボタン共通：システムUI用の押下フィードバック */
    .controlbtn:not(.ghost-nav),
    .subbtn,
    .action{
      transform-origin:center center;
      transition:
        transform 80ms cubic-bezier(.2,.8,.3,1),
        background 70ms ease-out,
        box-shadow 70ms ease-out;
      will-change:transform;
    }
    .controlbtn:not(.ghost-nav).is-pressed,
    .subbtn.is-pressed,
    .action.is-pressed{
      transform:scale(.965);
    }

    dialog{
      width:min(94vw,520px);
      max-height:min(84dvh,760px);
      border:0;border-radius:22px;padding:0;
      background:var(--panel);color:var(--ink);
      box-shadow:0 18px 60px rgba(0,0,0,.2);
    }
    dialog::backdrop{background:rgba(0,0,0,.32)}

    /* 月テーマ全文：枠を持たない、ぼかし主体のガラス表現 */
    #readingDialog{
      width:100vw;
      height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));
      max-width:none;
      max-height:none;
      margin:
        env(safe-area-inset-top)
        0
        env(safe-area-inset-bottom);
      border:0;
      border-radius:0;
      outline:none;
      padding:18px 14px 12px;
      background:transparent;
      box-shadow:none;
      color:var(--ink);
      overflow:hidden;
    }
    #readingDialog:focus,
    #readingDialog:focus-visible{
      outline:none;
      box-shadow:none;
    }
    #readingDialog::backdrop{
      background:rgba(247,244,239,.18);
      -webkit-backdrop-filter:blur(16px) saturate(112%);
      backdrop-filter:blur(16px) saturate(112%);
      opacity:0;
      transition:opacity 120ms ease-out;
    }
    #readingDialog.is-visible::backdrop{
      opacity:1;
    }
    #readingDialog .modal{
      background:transparent;
      width:100%;
      max-width:520px;
      max-height:100%;
      height:auto;
      margin:0 auto;
      opacity:0;
      transition:opacity 120ms ease-out;
      will-change:opacity;
    }
    #readingDialog.is-visible .modal{
      opacity:1;
    }
    #readingDialog .modal-head{
      position:relative;
      top:auto;
      background:transparent;
      border:0;
      outline:none;
      box-shadow:none;
      padding:12px 14px;
      min-height:62px;
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
    }
    #readingDialog .modal-head:focus,
    #readingDialog .modal-head:focus-visible{
      outline:none;
      box-shadow:none;
    }
    #readingDialog .reading-head-copy{
      min-width:0;
      width:100%;
      text-align:center;
    }
    #readingDialog .reading-eyebrow{
      font-size:11px;
      color:var(--sub);
      margin-bottom:3px;
    }
    #readingDialog .reading-title{
      font-size:16px;
      font-weight:700;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }
    #readingDialog .modal-body{
      padding:8px 14px 24px;
      overflow:auto;
      flex:1 1 auto;
      min-height:0;
      -webkit-overflow-scrolling:touch;
      -webkit-mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
      mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
    }
    #readingDialog .section{
      margin-bottom:28px;
    }
    #readingDialog .section h3{
      font-size:11px;
      letter-spacing:.08em;
      text-transform:uppercase;
      margin:0 0 8px;
      color:var(--sub);
      display:block;
    }
    #readingDialog .section h3::after{
      content:"";
      display:block;
      width:100%;
      height:1px;
      margin-top:7px;
      background:var(--separator);
    }
    #readingDialog .section .lead{
      font-size:19px;
      font-weight:750;
      margin-bottom:10px;
    }
    #readingDialog .prose{
      font-size:15px;
      line-height:1.85;
    }

    /* 月テーマ：起動中、その月を最初に開いた1回だけ項目をしっとり入場 */
    #readingDialog.first-entrance .entrance-pending{
      opacity:0;
      transform:translateY(9px);
      will-change:opacity,transform;
    }
    #readingDialog.first-entrance.is-visible .entrance-pending.entrance-visible{
      animation:readingItemEntrance 1360ms cubic-bezier(.22,.68,.24,1) both;
    }
    @keyframes readingItemEntrance{
      0%{
        opacity:0;
        transform:translateY(9px);
      }
      45%{
        opacity:.54;
        transform:translateY(2px);
      }
      75%{
        opacity:.82;
        transform:translateY(0);
      }
      100%{
        opacity:1;
        transform:translateY(0);
      }
    }
    @media (prefers-reduced-motion:reduce){
      #readingDialog.first-entrance .entrance-pending,
      #readingDialog.first-entrance.is-visible .entrance-pending.entrance-visible{
        opacity:1;
        transform:none;
        animation:none;
      }
    }

    /* 追加 / 編集：月テーマ詳細と同じ、枠なしのガラスレイヤー */
    #editDialog{
      width:100vw;
      height:100dvh;
      max-width:none;
      max-height:none;
      margin:0;
      border:0;
      border-radius:0;
      padding:
        max(18px, calc(env(safe-area-inset-top) + 6px))
        14px
        max(12px, env(safe-area-inset-bottom));
      background:transparent;
      box-shadow:none;
      color:var(--ink);
      overflow:hidden;
    }
    #editDialog::backdrop{
      background:rgba(247,244,239,.18);
      -webkit-backdrop-filter:blur(16px) saturate(112%);
      backdrop-filter:blur(16px) saturate(112%);
      opacity:0;
      transition:opacity 120ms ease-out;
    }
    #editDialog.is-visible::backdrop{opacity:1}
    #editDialog .modal{
      width:100%;
      max-width:520px;
      height:100%;
      max-height:100%;
      margin:0 auto;
      background:transparent;
      opacity:0;
      transition:opacity 120ms ease-out;
      will-change:opacity;
    }
    #editDialog.is-visible .modal{opacity:1}
    #editDialog .modal-head{
      position:relative;
      top:auto;
      min-height:62px;
      padding:12px 14px;
      background:transparent;
      border:0;
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:2;
    }
    #editDialog .modal-head h2{
      margin:0;
      font-size:16px;
      font-weight:700;
      text-align:center;
    }
    #editDialog .modal-body{
      flex:1 1 auto;
      min-height:0;
      padding:8px 14px 24px;
      overflow:auto;
      -webkit-overflow-scrolling:touch;
      -webkit-mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
      mask-image:linear-gradient(
        to bottom,
        transparent 0,
        #000 10px,
        #000 calc(100% - 10px),
        transparent 100%
      );
    }
    #editDialog textarea{

<body>
  <main class="app">
    <div class="month-number-bg" id="monthNumberBg">11</div>
    <section class="swipe-region" id="monthSwipeRegion" aria-label="月切り替え領域">

        <div class="theme-main">
          <div class="eyebrow">今月のテーマ</div>
          <div class="theme-title" id="themeTitle">マンスリー未登録</div>
        </div>
      </button>

      <section class="daily" aria-live="polite">
        <div class="daily-inner">
          <div id="dailyEmpty" class="empty">

  <dialog id="readingDialog">
    <div class="modal">
      <div class="modal-head" id="readingModalHead" aria-label="月テーマ詳細を閉じる">
        <div class="reading-head-copy">
          <div class="reading-eyebrow" id="readingEyebrow">2026年11月</div>
          <div class="reading-title" id="readingThemeTitle">鳥 × 波に乗る</div>
        </div>

  <dialog id="editDialog">
    <div class="modal">
      <div class="modal-head">
        <h2>マンスリーを追加 / 編集</h2>
      </div>
      <div class="modal-body">
        <textarea id="rawInput" placeholder="ここにマンスリー原文をそのまま貼り付け"></textarea>
        <div class="hint">
          基本書式：<br>
          【対象月】2026/11<br>
          【月テーマ】ルノルマン｜鳥 / ハワイアンロア｜波に乗る<br>
          【日ごと】1日｜十字架 … の形式
        </div>

          <button class="action secondary" id="parseBtn">カレンダー化</button>
          <button class="action hidden" id="saveBtn">この内容で保存</button>

  <dialog id="backupDialog">

        <div class="actions">
          <button class="action" id="exportBtn">書き出す</button>
          <label class="action secondary" style="display:grid;place-items:center;cursor:pointer">

<script>
(() => {
  'use strict';

  const STORAGE_KEY = 'pecoyomi.months.v1';
  const $ = (id) => document.getElementById(id);

  const state = {
    months: loadMonths(),
    viewYear: new Date().getFullYear(),
    viewMonth: new Date().getMonth() + 1,
    selectedDay: new Date().getDate(),
    pending: null
  };

  function loadMonths(){
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); }
    catch { return {}; }
  }
  function saveMonths(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state.months));
  }
  function keyOf(y,m){ return `${y}-${String(m).padStart(2,'0')}`; }
  function currentMonthData(){ return state.months[keyOf(state.viewYear,state.viewMonth)] || null; }
  function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
  function weekdayJa(y,m,d){ return ['日','月','火','水','木','金','土'][new Date(y,m-1,d).getDay()]; }

  // 日本の祝日を計算（現行制度ベース）
  function nthWeekdayOfMonth(year, month, weekday, nth){
    const first = new Date(year, month - 1, 1).getDay();
    return 1 + ((7 + weekday - first) % 7) + (nth - 1) * 7;
  }
  function vernalEquinoxDay(year){
    return Math.floor(20.8431 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  }
  function autumnEquinoxDay(year){
    return Math.floor(23.2488 + 0.242194 * (year - 1980) - Math.floor((year - 1980) / 4));
  }
  function baseJapaneseHolidays(year){
    const h = new Map();
    const add=(m,d,name)=>h.set(`${m}-${d}`,name);

    add(1,1,'元日');
    add(1,nthWeekdayOfMonth(year,1,1,2),'成人の日');
    add(2,11,'建国記念の日');
    add(2,23,'天皇誕生日');
    add(3,vernalEquinoxDay(year),'春分の日');
    add(4,29,'昭和の日');
    add(5,3,'憲法記念日');
    add(5,4,'みどりの日');
    add(5,5,'こどもの日');
    add(7,nthWeekdayOfMonth(year,7,1,3),'海の日');
    add(8,11,'山の日');
    add(9,nthWeekdayOfMonth(year,9,1,3),'敬老の日');
    add(9,autumnEquinoxDay(year),'秋分の日');
    add(10,nthWeekdayOfMonth(year,10,1,2),'スポーツの日');
    add(11,3,'文化の日');
    add(11,23,'勤労感謝の日');

    return h;
  }
  function japaneseHolidayMap(year){
    const base = baseJapaneseHolidays(year);
    const result = new Map(base);

    // 国民の休日：祝日に挟まれた平日
    for(let m=1;m<=12;m++){
      const max = new Date(year,m,0).getDate();
      for(let d=2;d<max;d++){
        const key=`${m}-${d}`;
        if(result.has(key)) continue;
        const prevDate=new Date(year,m-1,d-1);
        const nextDate=new Date(year,m-1,d+1);
        const prevKey=`${prevDate.getMonth()+1}-${prevDate.getDate()}`;
        const nextKey=`${nextDate.getMonth()+1}-${nextDate.getDate()}`;
        if(base.has(prevKey) && base.has(nextKey)){
          result.set(key,'国民の休日');
        }
      }
    }

    // 振替休日：日曜の祝日の次の「祝日でない日」
    const ordered=[...base.entries()].map(([key,name])=>{
      const [m,d]=key.split('-').map(Number);
      return {m,d,name,date:new Date(year,m-1,d)};
    }).sort((a,b)=>a.date-b.date);

    for(const item of ordered){
      if(item.date.getDay()!==0) continue;
      let dt=new Date(year,item.m-1,item.d+1);
      while(dt.getFullYear()===year){
        const k=`${dt.getMonth()+1}-${dt.getDate()}`;
        if(!result.has(k)){
          result.set(k,'振替休日');
          break;
        }
        dt.setDate(dt.getDate()+1);
      }
    }
    return result;
  }

  function escapeHtml(s=''){
    return String(s).replace(/[&<>"']/g, ch => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    })[ch]);
  }
  function renderText(s=''){
    let safe = escapeHtml(s);
    safe = safe.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    return safe.replace(/\n/g,'<br>');
  }

  function extractSections(raw){
    const out = {};
    const re = /【([^】]+)】/g;
    const matches = [...raw.matchAll(re)];
    matches.forEach((m,i)=>{
      const name = m[1].trim();
      const start = m.index + m[0].length;
      const end = i + 1 < matches.length ? matches[i+1].index : raw.length;
      out[name] = raw.slice(start,end).trim();
    });
    return out;
  }

  function parseTheme(text=''){
    const lines = text.split(/\r?\n/);
    let lenormand = '', loa = '';
    const body = [];
    for (const line of lines){
      const t = line.trim();
      let m;
      if ((m = t.match(/^ルノルマン\s*[｜|]\s*(.+)$/))) lenormand = m[1].trim();
      else if ((m = t.match(/^ハワイアンロア\s*[｜|]\s*(.+)$/))) loa = m[1].trim();
      else body.push(line);
    }
    if (!lenormand && !loa){
      const firstNonEmpty = body.findIndex(x => x.trim());
      if (firstNonEmpty >= 0){
        const first = body[firstNonEmpty].trim();
        const p = first.split(/\s*[+＋]\s*/);
        if (p.length >= 2){
          lenormand = p.shift().trim();
          loa = p.join('+').trim();
          body.splice(firstNonEmpty,1);
        }
      }
    }
    return { lenormand, loa, text: body.join('\n').trim() };
  }

  function parseMoon(text=''){
    const lines = text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
    if (!lines.length) return null;
    const dm = lines[0].match(/(\d{1,2})\s*\/\s*(\d{1,2})/);
    const card = lines[1] || '';
    return dm ? {
      month:Number(dm[1]), day:Number(dm[2]), card,
      text:lines.slice(2).join('\n').trim()
    } : null;
  }

  function parseDays(text=''){
    const lines = text.split(/\r?\n/);
    const days = {};
    let current = null;
    let body = [];
    const flush = () => {
      if (current){
        days[current.day] = { card: current.card, text: body.join('\n').trim() };
      }
      body = [];
    };
    for (const line of lines){
      const m = line.match(/^\s*(\d{1,2})日\s*[｜|]\s*(.+?)\s*$/);
      if (m){
        flush();
        current = { day:Number(m[1]), card:m[2].trim() };
      } else if (current){
        body.push(line);
      }
    }
    flush();
    return days;
  }

  function parseRaw(raw){
    const sections = extractSections(raw);
    const target = (sections['対象月'] || '').match(/(\d{4})\s*[\/\-]\s*(\d{1,2})/);
    if (!target) throw new Error('【対象月】に 2026/11 のような年月が見つからないよ。');

    const year = Number(target[1]);
    const month = Number(target[2]);
    if (month < 1 || month > 12) throw new Error('対象月の「月」が1〜12になっていないよ。');

    const creation = (sections['作成日'] || '').match(/(\d{4})\s*[\/\-]\s*(\d{1,2})\s*[\/\-]\s*(\d{1,2})/);
    const theme = parseTheme(sections['月テーマ'] || '');
    const days = parseDays(sections['日ごと'] || '');
    const max = daysInMonth(year,month);
    const nums = Object.keys(days).map(Number);
    const invalid = nums.filter(d => d < 1 || d > max);
    invalid.forEach(d => delete days[d]);

    return {
      version:1,
      year, month,
      createdAt: creation ? `${creation[1]}-${String(creation[2]).padStart(2,'0')}-${String(creation[3]).padStart(2,'0')}` : '',
      theme,
      overview: sections['全体'] || '',
      newMoon: parseMoon(sections['新月'] || ''),
      fullMoon: parseMoon(sections['満月'] || ''),
      days,
      raw
    };
  }

  function validateMonth(data){
    const max = daysInMonth(data.year,data.month);
    const present = Object.keys(data.days).map(Number);
    const missing = [];
    for (let d=1; d<=max; d++) if (!present.includes(d)) missing.push(d);
    const warnings = [];
    if (!data.theme.lenormand) warnings.push('月テーマの「ルノルマン」が未取得');
    if (!data.theme.loa) warnings.push('月テーマの「ハワイアンロア」が未取得');
    if (!data.overview) warnings.push('【全体】が空');
    if (!data.newMoon) warnings.push('【新月】を取得できていない');
    if (!data.fullMoon) warnings.push('【満月】を取得できていない');
    if (missing.length) warnings.push(`日別が ${present.length}/${max} 件（未取得: ${missing.join(', ')}日）`);
    return { max, present: present.length, missing, warnings };
  }

  function monthNameEn(month){
    return ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'][month-1];
  }

  function render(){
    $('monthTitle').textContent = `${monthNameEn(state.viewMonth)} ${state.viewYear}`;
    $('monthNumberBg').textContent = String(state.viewMonth);
    const data = currentMonthData();
    const max = daysInMonth(state.viewYear,state.viewMonth);
    if (state.selectedDay > max) state.selectedDay = max;

    if (data){
      const tt = [data.theme.lenormand, data.theme.loa].filter(Boolean).join(' × ');
      $('themeTitle').textContent = tt || 'テーマ未設定';
    } else {
      $('themeTitle').textContent = 'マンスリー未登録';
    }

    renderDaily(data);
    renderCalendar(data);
  }

  function renderDaily(data){
    const d = state.selectedDay;
    const dayData = data?.days?.[d];
    if (!dayData){
      $('dailyContent').classList.add('hidden');
      $('dailyEmpty').classList.remove('hidden');
      $('dailyEmpty').innerHTML = data
        ? `${d}日のリーディングは未登録です。`
        : `この月のマンスリーはまだ登録されていません。<br>下の「月を追加 / 編集」から原文を貼り付けてね。`;
      return;
    }
    $('dailyEmpty').classList.add('hidden');
    $('dailyContent').classList.remove('hidden');
    $('dailyCard').textContent = dayData.card;
    $('dailyText').innerHTML = renderText(dayData.text);

    const moonParts = [];
    if(data?.newMoon?.day===d && data.newMoon.month===state.viewMonth){
      moonParts.push(`
        <div class="moon-reading">
          <div class="moon-label">NEW MOON</div>
          <div class="moon-text">${renderText(data.newMoon.text)}</div>
        </div>`);
    }
    if(data?.fullMoon?.day===d && data.fullMoon.month===state.viewMonth){
      moonParts.push(`
        <div class="moon-reading">
          <div class="moon-label">FULL MOON</div>
          <div class="moon-text">${renderText(data.fullMoon.text)}</div>
        </div>`);
    }
    $('moonReading').innerHTML = moonParts.join('');
  }

  function renderCalendar(data){
    const root = $('calendarDays');
    root.innerHTML = '';
    const first = new Date(state.viewYear,state.viewMonth-1,1).getDay();
    const max = daysInMonth(state.viewYear,state.viewMonth);
    const now = new Date();
    const holidays = japaneseHolidayMap(state.viewYear);

    for (let i=0;i<first;i++){
      const b = document.createElement('div');
      b.className='day blank'; root.appendChild(b);
    }

    for (let d=1; d<=max; d++){
      const btn = document.createElement('button');
      btn.type='button';
      btn.className='day';
      const dow = new Date(state.viewYear,state.viewMonth-1,d).getDay();
      const holidayName = holidays.get(`${state.viewMonth}-${d}`);
      if (dow===0) btn.classList.add('sun');
      if (holidayName) btn.classList.add('holiday');
      if (dow===6) btn.classList.add('sat');
      if (data?.days?.[d]) btn.classList.add('registered');
      if (d===state.selectedDay) btn.classList.add('selected');
      if (state.viewYear===now.getFullYear() && state.viewMonth===now.getMonth()+1 && d===now.getDate()) btn.classList.add('today');

      let moon = '';
      if (data?.newMoon?.day===d && data.newMoon.month===state.viewMonth) moon += '<span class="moon">●</span>';
      if (data?.fullMoon?.day===d && data.fullMoon.month===state.viewMonth) moon += '<span class="moon">○</span>';
      const symbol = data?.days?.[d]?.card || '';
      btn.innerHTML = `<span class="day-number">${d}</span><span class="day-symbol">${escapeHtml(symbol)}</span>${moon}`;
      btn.setAttribute('aria-label', `${state.viewMonth}月${d}日${symbol ? '、'+symbol : ''}`);
      btn.addEventListener('click',()=>{state.selectedDay=d;render();});
      root.appendChild(btn);
    }
  }

  function changeMonth(delta){
    let y=state.viewYear, m=state.viewMonth+delta;
    if (m<1){m=12;y--}
    if (m>12){m=1;y++}
    state.viewYear=y; state.viewMonth=m; state.selectedDay=1;
    render();
  }

  function changeDay(delta){
    let dt = new Date(state.viewYear,state.viewMonth-1,state.selectedDay+delta);
    state.viewYear=dt.getFullYear();
    state.viewMonth=dt.getMonth()+1;
    state.selectedDay=dt.getDate();
    render();
  }

  function goToday(){
    const n=new Date();
    state.viewYear=n.getFullYear();state.viewMonth=n.getMonth()+1;state.selectedDay=n.getDate();
    render();
  }

  const DIALOG_FADE_MS = 120;

  // 月テーマの段階入場は、このページ起動中「その月を最初に開いた1回だけ」。
  // 月を跨げば再生し、いったん見た月へ戻った場合は再生しない。
  const readingEntrancePlayedMonths = new Set();
  let readingEntranceObserver = null;
  let readingEntranceRevealTimers = [];
  let lastReadingMonthKey = null;

  function fadeInDialog(dlg){
    dlg.classList.remove('is-visible');
    dlg.showModal();
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>dlg.classList.add('is-visible'));
    });
  }

  function fadeOutDialog(dlg, afterClose){
    if(!dlg.open) return;
    dlg.classList.remove('is-visible');
    window.setTimeout(()=>{
      if(dlg.open) dlg.close();
      if(typeof afterClose === 'function') afterClose();
    }, DIALOG_FADE_MS);
  }

  function clearReadingEntrance(dlg){
    if(readingEntranceObserver){
      readingEntranceObserver.disconnect();
      readingEntranceObserver=null;
    }
    readingEntranceRevealTimers.forEach(id=>window.clearTimeout(id));
    readingEntranceRevealTimers=[];
    dlg.classList.remove('first-entrance');
    dlg.querySelectorAll('.entrance-pending,.entrance-visible').forEach(el=>{
      el.classList.remove('entrance-pending','entrance-visible');
      delete el.dataset.entranceScheduled;
    });
  }

  function scheduleReadingReveal(el, delay, dlg){
    if(!el || el.dataset.entranceScheduled==='1') return;
    el.dataset.entranceScheduled='1';
    const timer=window.setTimeout(()=>{
      if(dlg.open && dlg.classList.contains('first-entrance')){
        el.classList.add('entrance-visible');
      }
    },delay);
    readingEntranceRevealTimers.push(timer);
  }

  function startReadingEntrance(dlg){
    const body=$('readingBody');
    const head=dlg.querySelector('.reading-head-copy');
    const bodyItems=[...dlg.querySelectorAll('#readingBody > .section, #readingBody > .empty')];

    const allItems=[head,...bodyItems].filter(Boolean);
    allItems.forEach(el=>{
      el.classList.add('entrance-pending');
      el.classList.remove('entrance-visible');
      delete el.dataset.entranceScheduled;
    });

    // ヘッダーは最初に。画面内にある本文項目は少しずつずらして入れる。
    scheduleReadingReveal(head,70,dlg);

    const rootRect=body.getBoundingClientRect();
    let visibleOrder=0;
    bodyItems.forEach(el=>{
      const rect=el.getBoundingClientRect();
      const inView=rect.bottom>rootRect.top && rect.top<rootRect.bottom;
      if(inView){
        scheduleReadingReveal(el,140 + visibleOrder * 70,dlg);
        visibleOrder++;
      }
    });

    // 初期画面外の項目は、スクロールで画面内へ入って約0.3秒後に再生。
    if('IntersectionObserver' in window){
      readingEntranceObserver=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(!entry.isIntersecting) return;
          const el=entry.target;
          if(el.dataset.entranceScheduled!=='1'){
            scheduleReadingReveal(el,300,dlg);
          }
          readingEntranceObserver?.unobserve(el);
        });
      },{
        root:body,
        threshold:.08
      });

      bodyItems.forEach(el=>{
        if(el.dataset.entranceScheduled!=='1'){
          readingEntranceObserver.observe(el);
        }
      });
    }else{
      // 古い環境では隠れたままにしない。
      bodyItems.forEach(el=>{
        if(el.dataset.entranceScheduled!=='1'){
          scheduleReadingReveal(el,300,dlg);
        }
      });
    }
  }

  function openReading(){
    const data=currentMonthData();
    $('readingEyebrow').textContent=`${state.viewYear}年${state.viewMonth}月`;
    const themeName=data ? [data.theme.lenormand,data.theme.loa].filter(Boolean).join(' × ') : '';
    $('readingThemeTitle').textContent=themeName || 'テーマ未登録';
    if(!data){
      $('readingBody').innerHTML='<div class="empty">この月はまだ登録されていません。</div>';
    }else{
      $('readingBody').innerHTML=`
        <section class="section">
          <h3>月テーマ</h3>
          <div class="lead">${escapeHtml(themeName)}</div>
          <div class="prose">${renderText(data.theme.text)}</div>
        </section>
        <section class="section">
          <h3>全体</h3>
          <div class="prose">${renderText(data.overview)}</div>
        </section>
        ${data.newMoon ? `<section class="section"><h3>新月 ${data.newMoon.month}/${data.newMoon.day}</h3><div class="lead">${escapeHtml(data.newMoon.card)}</div><div class="prose">${renderText(data.newMoon.text)}</div></section>`:''}
        ${data.fullMoon ? `<section class="section"><h3>満月 ${data.fullMoon.month}/${data.fullMoon.day}</h3><div class="lead">${escapeHtml(data.fullMoon.card)}</div><div class="prose">${renderText(data.fullMoon.text)}</div></section>`:''}
      `;
    }

    const dlg=$('readingDialog');
    const body=$('readingBody');
    const entranceMonthKey=keyOf(state.viewYear,state.viewMonth);

    // 別の月へ跨いで開いた場合は、前の月のスクロール位置を引き継がず必ず先頭へ。
    if(lastReadingMonthKey!==entranceMonthKey){
      body.scrollTop=0;
    }
    lastReadingMonthKey=entranceMonthKey;

    clearReadingEntrance(dlg);

    const isFirstEntrance=!readingEntrancePlayedMonths.has(entranceMonthKey);
    dlg.classList.toggle('first-entrance',isFirstEntrance);
    if(isFirstEntrance){
      readingEntrancePlayedMonths.add(entranceMonthKey);

      // 表示前に隠しておき、全体フェード開始後に画面内判定を行う。
      const head=dlg.querySelector('.reading-head-copy');
      const bodyItems=[...dlg.querySelectorAll('#readingBody > .section, #readingBody > .empty')];
      [head,...bodyItems].filter(Boolean).forEach(el=>el.classList.add('entrance-pending'));
    }

    document.body.classList.add('reading-open');
    fadeInDialog(dlg);

    if(isFirstEntrance){
      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>startReadingEntrance(dlg));
      });
    }
  }

  function closeReading(){
    const dlg=$('readingDialog');
    document.body.classList.remove('reading-open');
    fadeOutDialog(dlg,()=>clearReadingEntrance(dlg));
  }

  function openEditor(){
    const data=currentMonthData();
    $('rawInput').value=data?.raw || '';
    $('parseReport').classList.add('hidden');
    $('saveBtn').classList.add('hidden');
    state.pending=null;
    renderDelete(data);
    const dlg=$('editDialog');
    document.body.classList.add('edit-open');
    fadeInDialog(dlg);
  }

  function closeEditor(){
    document.body.classList.remove('edit-open');
    fadeOutDialog($('editDialog'));
  }

  function openBackup(){
    fadeInDialog($('backupDialog'));
  }

  function closeBackup(){
    fadeOutDialog($('backupDialog'));
  }

  function renderDelete(data){
    const area=$('deleteArea');
    area.innerHTML='';
    if(!data) return;
    const btn=document.createElement('button');
    btn.className='action danger';
    btn.textContent='この月を削除';
    btn.addEventListener('click',()=>{
      if(confirm(`${data.year}年${data.month}月を削除する？`)){
        delete state.months[keyOf(data.year,data.month)];
        saveMonths(); closeEditor(); render();
      }
    });
    area.appendChild(btn);
  }

  $('parseBtn').addEventListener('click',()=>{
    const box=$('parseReport');
    try{
      const data=parseRaw($('rawInput').value);
      const v=validateMonth(data);
      state.pending=data;
      box.className='report';
      box.innerHTML=`
        <strong>${data.year}年${data.month}月</strong> として読み取りました。<br>
        日別：${v.present}/${v.max}件<br>
        月テーマ：${escapeHtml([data.theme.lenormand,data.theme.loa].filter(Boolean).join(' × ') || '未取得')}<br>
        新月：${data.newMoon ? `${data.newMoon.month}/${data.newMoon.day} ${escapeHtml(data.newMoon.card)}` : '未取得'}<br>
        満月：${data.fullMoon ? `${data.fullMoon.month}/${data.fullMoon.day} ${escapeHtml(data.fullMoon.card)}` : '未取得'}
        ${v.warnings.length ? `<br><br>⚠️ ${v.warnings.map(escapeHtml).join('<br>⚠️ ')}` : '<br><br>✓ 大きな抜けは見つかりませんでした。'}
      `;
      box.classList.remove('hidden');
      $('saveBtn').classList.remove('hidden');
    }catch(e){
      state.pending=null;
      box.className='report bad';
      box.textContent=e.message;
      box.classList.remove('hidden');
      $('saveBtn').classList.add('hidden');
    }
  });

  $('saveBtn').addEventListener('click',()=>{
    if(!state.pending) return;
    const data=state.pending;
    state.months[keyOf(data.year,data.month)]=data;
    saveMonths();
    state.viewYear=data.year;state.viewMonth=data.month;
    const now=new Date();
    state.selectedDay = (now.getFullYear()===data.year && now.getMonth()+1===data.month) ? now.getDate() : 1;
    closeEditor();
    render();
  });

  function exportBackup(){
    const payload={app:'pecoyomi',version:1,exportedAt:new Date().toISOString(),months:state.months};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=`pecoyomi_backup_${new Date().toISOString().slice(0,10)}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  }

  $('importInput').addEventListener('change',async(e)=>{
    const file=e.target.files?.[0];
    if(!file) return;
    try{
      const obj=JSON.parse(await file.text());
      if(obj.app!=='pecoyomi' || !obj.months) throw new Error('pecoyomiのバックアップではないみたい。');
      if(!confirm('現在の登録データを、選んだバックアップで置き換える？')) return;
      state.months=obj.months;saveMonths();closeBackup();render();
      alert('復元しました。');
    }catch(err){ alert(err.message || '復元できませんでした。'); }
    e.target.value='';
  });

  const monthSwipeRegion = $('monthSwipeRegion');
  let swipeStartX = 0;
  let swipeStartY = 0;
  let swipeDx = 0;
  let swipeActive = false;
  let swipeHorizontal = false;
  let swipeAnimating = false;

  function setSwipeTransform(x, animate=false){
    monthSwipeRegion.style.transition = animate
      ? 'transform 180ms cubic-bezier(.22,.8,.28,1), opacity 180ms ease'
      : 'none';
    monthSwipeRegion.style.transform = `translate3d(${x}px,0,0)`;
  }

  function finishMonthSwipe(direction){
    if(swipeAnimating) return;
    swipeAnimating = true;

    const width = Math.max(monthSwipeRegion.clientWidth, 320);
    const monthNumber = $('monthNumberBg');

    // 月番号だけ先に短く退場。45ms後に月を更新して、すぐ入場させる。
    monthNumber.style.transition = 'opacity 45ms ease-out';
    monthNumber.style.opacity = '0';

    window.setTimeout(()=>{
      changeMonth(direction);

      const enterX = direction > 0 ? width * 0.10 : -width * 0.10;
      monthSwipeRegion.style.transition = 'none';
      monthSwipeRegion.style.transform = `translate3d(${enterX}px,0,0)`;
      monthSwipeRegion.style.opacity = '.82';

      monthNumber.style.transition = 'opacity 65ms ease-in';
      requestAnimationFrame(()=>{
        monthNumber.style.opacity = '1';
      });

      requestAnimationFrame(()=>{
        requestAnimationFrame(()=>{
          monthSwipeRegion.style.transition = 'transform 110ms cubic-bezier(.2,.8,.3,1), opacity 90ms ease-out';
          monthSwipeRegion.style.transform = 'translate3d(0,0,0)';
          monthSwipeRegion.style.opacity = '1';

          window.setTimeout(()=>{
            swipeAnimating = false;
            monthSwipeRegion.style.transition = '';
            monthSwipeRegion.style.transform = '';
            monthSwipeRegion.style.opacity = '';
            monthNumber.style.transition = '';
            monthNumber.style.opacity = '';
          }, 120);
        });
      });
    }, 45);
  }

  const appSwipeRegion = document.querySelector('.app');
  let suppressNextMainClick = false;

  appSwipeRegion.addEventListener('pointerdown',(e)=>{
    if(swipeAnimating) return;
    swipeStartX = e.clientX;
    swipeStartY = e.clientY;
    swipeDx = 0;
    swipeActive = true;
    swipeHorizontal = false;
    monthSwipeRegion.classList.add('is-dragging');
  });

  appSwipeRegion.addEventListener('pointermove',(e)=>{
    if(!swipeActive || swipeAnimating) return;
    const dx = e.clientX - swipeStartX;
    const dy = e.clientY - swipeStartY;

    if(!swipeHorizontal && (Math.abs(dx) > 8 || Math.abs(dy) > 8)){
      if(Math.abs(dx) <= Math.abs(dy)){
        swipeActive = false;
        monthSwipeRegion.classList.remove('is-dragging');
        setSwipeTransform(0, true);
        return;
      }
      swipeHorizontal = true;
    }

    if(swipeHorizontal){
      swipeDx = dx;
      const resisted = dx * .72;
      setSwipeTransform(resisted, false);
    }
  });

  function endSwipe(){
    if(!swipeActive || swipeAnimating) return;
    swipeActive = false;
    monthSwipeRegion.classList.remove('is-dragging');

    if(swipeHorizontal && Math.abs(swipeDx) >= 56){
      // 横フリック成立後のボタンclickを1回だけ抑制
      suppressNextMainClick = true;
      window.setTimeout(()=>{ suppressNextMainClick = false; }, 260);

      // 左フリック = 翌月、右フリック = 前月
      finishMonthSwipe(swipeDx < 0 ? 1 : -1);
    }else{
      monthSwipeRegion.style.opacity = '1';
      monthSwipeRegion.style.transition = 'transform 110ms cubic-bezier(.2,.8,.3,1)';
      monthSwipeRegion.style.transform = 'translate3d(0,0,0)';
      window.setTimeout(()=>{
        monthSwipeRegion.style.transition = '';
        monthSwipeRegion.style.transform = '';
      }, 120);
    }
  }

  appSwipeRegion.addEventListener('pointerup', endSwipe);
  appSwipeRegion.addEventListener('pointercancel', endSwipe);
  appSwipeRegion.addEventListener('lostpointercapture', endSwipe);

  appSwipeRegion.addEventListener('click',(e)=>{
    if(!suppressNextMainClick) return;
    e.preventDefault();
    e.stopPropagation();
    suppressNextMainClick = false;
  }, true);

  $('prevDay').addEventListener('click',()=>changeDay(-1));
  $('nextDay').addEventListener('click',()=>changeDay(1));
  $('todayBtn').addEventListener('click',goToday);
  $('themeButton').addEventListener('click',openReading);
  let suppressEditMonthClick = false;

  $('editMonth').addEventListener('click',(e)=>{
    if(suppressEditMonthClick){
      e.preventDefault();
      e.stopPropagation();
      suppressEditMonthClick = false;
      return;
    }
    openEditor();
  });
  $('backupBtn').addEventListener('click',openBackup);
  $('exportBtn').addEventListener('click',exportBackup);

  document.querySelectorAll('[data-close]').forEach(btn=>{
    btn.addEventListener('click',()=>$(btn.dataset.close).close());
  });

  $('readingDialog').addEventListener('click',(e)=>{
    if(e.target === $('readingDialog')) closeReading();
  });

  $('readingModalHead').addEventListener('click',closeReading);
  $('readingDialog').addEventListener('cancel',(e)=>{
    e.preventDefault();
    closeReading();
  });

  $('cancelEditBtn').addEventListener('click',closeEditor);

  $('editDialog').addEventListener('click',(e)=>{
    if(e.target === $('editDialog')) closeEditor();
  });
  $('editDialog').addEventListener('cancel',(e)=>{
    e.preventDefault();
    closeEditor();
  });

  // 「月を追加 / 編集」の裏メニュー：
  // 0.5秒ホールドで進捗開始 → 中央から0.7秒かけて塗り切る → バックアップを開く。
  (() => {
    const btn = $('editMonth');
    let holdTimer = null;
    let fillTimer = null;
    let filling = false;
    let secretOpened = false;

    const clearTimers = ()=>{
      if(holdTimer){
        window.clearTimeout(holdTimer);
        holdTimer = null;
      }
      if(fillTimer){
        window.clearTimeout(fillTimer);
        fillTimer = null;
      }
    };

    const resetFill = ()=>{
      btn.classList.remove('is-secret-filling');
      filling = false;
    };

    btn.addEventListener('pointerdown',()=>{
      clearTimers();
      resetFill();
      secretOpened = false;

      holdTimer = window.setTimeout(()=>{
        filling = true;
        btn.classList.add('is-secret-filling');

        fillTimer = window.setTimeout(()=>{
          secretOpened = true;
          suppressEditMonthClick = true;
          btn.classList.remove('is-secret-filling');
          filling = false;
          openBackup();
        },700);
      },500);
    });

    const cancelLongPress = ()=>{
      // 0.5秒を超えて一度でも裏メニュー判定に入った場合は、
      // 指を途中で離しても通常の編集クリックへ流さない。
      if(filling || secretOpened){
        suppressEditMonthClick = true;
      }
      clearTimers();
      if(!secretOpened) resetFill();
    };

    btn.addEventListener('pointerup',cancelLongPress);
    btn.addEventListener('pointercancel',cancelLongPress);
    btn.addEventListener('pointerleave',cancelLongPress);
  })();

  $('backupDialog').addEventListener('click',(e)=>{
    const dlg=$('backupDialog');
    const r=dlg.getBoundingClientRect();
    if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) closeBackup();
  });
  $('backupDialog').addEventListener('cancel',(e)=>{
    e.preventDefault();
    closeBackup();
  });

  // 月テーマは特殊ボタンとして独立管理。
  // 通常ボタンとは別に演出調整できるよう、専用クラスを使う。
  (() => {
    const btn = $('themeButton');
    let timer = null;
    const pressIn = ()=>{
      if(timer) window.clearTimeout(timer);
      btn.classList.add('is-theme-pressed');
    };
    const pressOut = ()=>{
      if(timer) window.clearTimeout(timer);
      timer = window.setTimeout(()=>{
        btn.classList.remove('is-theme-pressed');
      },70);
    };
    btn.addEventListener('pointerdown', pressIn);
    btn.addEventListener('pointerup', pressOut);
    btn.addEventListener('pointercancel', pressOut);
    btn.addEventListener('pointerleave', pressOut);
  })();

  // 通常ボタン共通。
  // イベント委譲にして、renderDelete() で後から生成される
  // 「この月を削除」も自動的に同じ押下演出へ含める。
  const COMMON_BUTTON_SELECTOR = '.controlbtn:not(.ghost-nav), .subbtn, .action';
  const commonPressTimers = new WeakMap();

  const commonPressIn = (btn)=>{
    const oldTimer = commonPressTimers.get(btn);
    if(oldTimer) window.clearTimeout(oldTimer);
    btn.classList.add('is-pressed');
  };

  const commonPressOut = (btn)=>{
    const oldTimer = commonPressTimers.get(btn);
    if(oldTimer) window.clearTimeout(oldTimer);
    const timer = window.setTimeout(()=>{
      btn.classList.remove('is-pressed');
      commonPressTimers.delete(btn);
    },70);
    commonPressTimers.set(btn,timer);
  };

  document.addEventListener('pointerdown',(e)=>{
    const btn = e.target.closest?.(COMMON_BUTTON_SELECTOR);
    if(btn) commonPressIn(btn);
  });

  ['pointerup','pointercancel','pointerleave'].forEach(type=>{
    document.addEventListener(type,(e)=>{
      const btn = e.target.closest?.(COMMON_BUTTON_SELECTOR);
      if(btn) commonPressOut(btn);
    }, true);
  });

  render();
})();
</script>
</body>
</html>
